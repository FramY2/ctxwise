name: "CtxWise — AI Context Firewall, Budget & Drift Guard"
description: "Audit CLAUDE.md, AGENTS.md, Cursor rules, and MCP schemas. Block secret leaks, prompt injection, and token budget bloat in CI."
author: "FramY2"
branding:
  icon: "shield"
  color: "blue"

inputs:
  max-known-tokens:
    description: "Maximum estimated startup token budget for the heaviest agent session (set to 0 to skip the budget check). Ignored when a budget policy file is used."
    required: false
    default: "4000"
  budget-policy:
    description: "Path to a versioned YAML budget policy. When empty, ./ctxwise.budget.yaml (written by `ctxwise init` / `ctxwise preset`) is used automatically if it exists."
    required: false
    default: ""
  fail-on-secrets:
    description: "Fail the workflow if hardcoded API keys, prompt injection, or hidden Unicode are detected in agent context files"
    required: false
    default: "true"
  check-agent-parity:
    description: "Report the multi-agent context surface across Claude Code, OpenAI Codex, and Cursor, and fail when CLAUDE.md and AGENTS.md have diverged (`ctxwise agents --fail-on-divergence`)"
    required: false
    default: "true"
  drift-lockfile:
    description: "Optional path to a baseline capability lockfile (e.g. examples/ci-baseline.lock.json or ctxwise.lock.json) to check for context drift in CI (`ctxwise drift`)."
    required: false
    default: ""
  drift-policy:
    description: "Optional path to a versioned YAML fail-closed drift policy (`ctxwise drift --policy`). Used with drift-lockfile."
    required: false
    default: ""
  node-version:
    description: "Node.js version to run CtxWise"
    required: false
    default: "22"
  sarif-file:
    description: "Optional path to write a SARIF 2.1.0 security report for GitHub Code Scanning"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Run CtxWise Context Shield (Secret & Prompt-Injection Guard)
      shell: bash
      env:
        CTXWISE_SARIF_FILE: ${{ inputs.sarif-file }}
        CTXWISE_FAIL_ON_SECRETS: ${{ inputs.fail-on-secrets }}
      run: |
        SARIF_ARGS=()
        if [ -n "$CTXWISE_SARIF_FILE" ]; then
          SARIF_ARGS=(--sarif "$CTXWISE_SARIF_FILE")
        fi
        if [ "$CTXWISE_FAIL_ON_SECRETS" = "true" ]; then
          npx --yes @framy2/ctxwise shield "${SARIF_ARGS[@]}" --fail-on-risk
        else
          npx --yes @framy2/ctxwise shield "${SARIF_ARGS[@]}"
        fi

    - name: Run Multi-Agent Context Surface Audit (Claude Code + Codex + Cursor)
      if: ${{ inputs.check-agent-parity == 'true' }}
      shell: bash
      run: npx --yes @framy2/ctxwise agents --fail-on-divergence

    - name: Enforce Startup Token Budget
      shell: bash
      env:
        CTXWISE_BUDGET_POLICY: ${{ inputs.budget-policy }}
        CTXWISE_MAX_KNOWN_TOKENS: ${{ inputs.max-known-tokens }}
      run: |
        if [ -n "$CTXWISE_BUDGET_POLICY" ]; then
          npx --yes @framy2/ctxwise budget --policy "$CTXWISE_BUDGET_POLICY" --fail-on-exceed
        elif [ -f "./ctxwise.budget.yaml" ]; then
          echo "Using auto-detected ./ctxwise.budget.yaml"
          npx --yes @framy2/ctxwise budget --policy "./ctxwise.budget.yaml" --fail-on-exceed
        elif [ "$CTXWISE_MAX_KNOWN_TOKENS" != "0" ]; then
          npx --yes @framy2/ctxwise budget --max-known-tokens "$CTXWISE_MAX_KNOWN_TOKENS" --fail-on-exceed
        else
          echo "Budget check skipped (max-known-tokens is 0 and no budget policy was found)."
        fi

    - name: Check Capability Drift
      if: ${{ inputs.drift-lockfile != '' || inputs.drift-policy != '' }}
      shell: bash
      env:
        CTXWISE_DRIFT_LOCKFILE: ${{ inputs.drift-lockfile }}
        CTXWISE_DRIFT_POLICY: ${{ inputs.drift-policy }}
      run: |
        if [ -z "$CTXWISE_DRIFT_LOCKFILE" ]; then
          echo "Error: drift-policy requires drift-lockfile to be set." >&2
          exit 1
        fi
        DRIFT_ARGS=("$CTXWISE_DRIFT_LOCKFILE" --fail-on-drift)
        if [ -n "$CTXWISE_DRIFT_POLICY" ]; then
          DRIFT_ARGS+=(--policy "$CTXWISE_DRIFT_POLICY")
        fi
        npx --yes @framy2/ctxwise drift "${DRIFT_ARGS[@]}"

    - name: Write CtxWise job summary
      if: ${{ always() }}
      shell: bash
      env:
        CTXWISE_BUDGET_POLICY: ${{ inputs.budget-policy }}
        CTXWISE_MAX_KNOWN_TOKENS: ${{ inputs.max-known-tokens }}
        CTXWISE_DRIFT_LOCKFILE: ${{ inputs.drift-lockfile }}
        CTXWISE_DRIFT_POLICY: ${{ inputs.drift-policy }}
      run: |
        if [ -z "${GITHUB_STEP_SUMMARY:-}" ]; then
          echo "GITHUB_STEP_SUMMARY is not set; skipping the job summary."
          exit 0
        fi
        TMP_DIR="${RUNNER_TEMP:-/tmp}/ctxwise-summary"
        mkdir -p "$TMP_DIR"
        npx --yes @framy2/ctxwise shield --json > "$TMP_DIR/shield.json" 2>/dev/null || true
        npx --yes @framy2/ctxwise agents --json > "$TMP_DIR/agents.json" 2>/dev/null || true
        BUDGET_ARGS=()
        if [ -n "$CTXWISE_BUDGET_POLICY" ]; then
          BUDGET_ARGS=(--policy "$CTXWISE_BUDGET_POLICY")
        elif [ -f "./ctxwise.budget.yaml" ]; then
          BUDGET_ARGS=(--policy "./ctxwise.budget.yaml")
        elif [ "$CTXWISE_MAX_KNOWN_TOKENS" != "0" ]; then
          BUDGET_ARGS=(--max-known-tokens "$CTXWISE_MAX_KNOWN_TOKENS")
        fi
        if [ ${#BUDGET_ARGS[@]} -gt 0 ]; then
          npx --yes @framy2/ctxwise budget "${BUDGET_ARGS[@]}" --json > "$TMP_DIR/budget.json" 2>/dev/null || true
        fi
        if [ -n "${CTXWISE_DRIFT_LOCKFILE:-}" ]; then
          DRIFT_ARGS=("$CTXWISE_DRIFT_LOCKFILE" --json)
          if [ -n "${CTXWISE_DRIFT_POLICY:-}" ]; then
            DRIFT_ARGS+=(--policy "$CTXWISE_DRIFT_POLICY")
          fi
          npx --yes @framy2/ctxwise drift "${DRIFT_ARGS[@]}" > "$TMP_DIR/drift.json" 2>/dev/null || true
        fi
        CTXWISE_SUMMARY_DIR="$TMP_DIR" node --input-type=module - >> "$GITHUB_STEP_SUMMARY" <<'NODE'
        import { readFileSync } from "node:fs";
        import { join } from "node:path";
        const dir = process.env.CTXWISE_SUMMARY_DIR;
        const read = (name) => {
          try {
            return JSON.parse(readFileSync(join(dir, name), "utf8"));
          } catch {
            return null;
          }
        };
        const fmt = (n) => (typeof n === "number" ? n.toLocaleString("en-US") : "n/a");
        const shield = read("shield.json");
        const agents = read("agents.json");
        const budget = read("budget.json");
        const drift = read("drift.json");
        const lines = ["## 🛡️ CtxWise context report", ""];
        if (shield?.summary) {
          const s = shield.summary;
          const risky = (s.critical ?? 0) + (s.high ?? 0);
          lines.push(
            `**Shield:** ${risky > 0 ? "❌ risks found" : s.total > 0 ? "⚠️ warnings" : "✅ clean"} · ${fmt(s.critical ?? 0)} critical · ${fmt(s.high ?? 0)} high · ${fmt(s.medium ?? 0)} medium · ${fmt(s.low ?? 0)} low`,
          );
        } else {
          lines.push("**Shield:** n/a");
        }
        lines.push("");
        if (agents?.agents) {
          lines.push(
            `**Multi-agent parity:** ${agents.parityStatus === "diverged" ? "❌ diverged" : agents.parityStatus}`,
            "",
            "| Agent | Files | Est. startup tokens |",
            "| --- | ---: | ---: |",
          );
          for (const [id, label] of [["claude", "Claude Code"], ["codex", "OpenAI Codex"], ["cursor", "Cursor"]]) {
            const a = agents.agents[id];
            if (a) lines.push(`| ${label} | ${fmt(a.files)} | ~${fmt(a.estimatedStartupTokens)} |`);
          }
          lines.push("");
        }
        if (budget?.status) {
          const icon = budget.status === "within-budget" ? "✅" : budget.status === "over-budget" ? "❌" : "⚠️";
          const limit = budget.limits?.maxKnownTokens;
          const heaviest = budget.agentBreakdown?.budgetedAgent;
          lines.push(
            `**Budget:** ${icon} ${budget.status} · ~${fmt(budget.estimatedKnownStartupTokens)} known startup tokens${limit !== undefined ? ` / ${fmt(limit)} limit` : ""}${heaviest ? ` (heaviest agent: ${heaviest})` : ""}${budget.policy ? ` · policy \`${budget.policy}\`` : ""}`,
          );
        } else {
          lines.push("**Budget:** skipped");
        }
        if (drift?.summary) {
          const d = drift.summary;
          const policyStatus = drift.policy?.status;
          const driftIcon = drift.policy
            ? drift.policy.blocking
              ? "❌"
              : policyStatus === "warn"
                ? "⚠️"
                : "✅"
            : drift.status === "clean"
              ? "✅"
              : "❌";
          const driftLabel = drift.policy
            ? `${drift.status} (policy: ${policyStatus})`
            : drift.status;
          lines.push(
            "",
            `**Drift:** ${driftIcon} ${driftLabel} · ${fmt(d.total)} changes (+${fmt(d.added)} -${fmt(d.removed)} ~${fmt(d.changed)})`,
          );
        }
        lines.push(
          "",
          "<sub>All counts are local estimates. Generated by [CtxWise](https://github.com/FramY2/ctxwise).</sub>",
          "",
        );
        process.stdout.write(lines.join("\n"));
        NODE
