name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Node ${{ matrix.node }} quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run formatting, types, tests, and coverage
        run: npm run check

      - name: Build distributable files
        run: npm run build

      - name: Dogfood the capability drift guard
        if: matrix.node == 24
        run: node dist/cli.js drift examples/ci-baseline.lock.json --codex-home .ctxwise/empty-home --project . --fail-on-drift

      - name: Dogfood multi-agent shield and stack presets
        if: matrix.node == 24
        run: |
          node dist/cli.js shield --project . --fail-on-risk
          node dist/cli.js agents --project . --codex-home .ctxwise/empty-home --claude-home .ctxwise/empty-home
          node dist/cli.js preset

      - name: Validate Codex plugin and skill
        run: npm run validate:plugin

      - name: Inspect npm package contents
        if: matrix.node == 24
        run: npm pack --dry-run
