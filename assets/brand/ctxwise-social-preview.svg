<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">CtxWise v1.0 — Multi-Agent Context Firewall &amp; MCP Schema Tree-Shaker</title>
  <desc id="desc">Local-first context firewall, MCP schema tree-shaker, and token budget guard for Claude Code, OpenAI Codex, and Cursor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B081B"/>
      <stop offset="0.48" stop-color="#070B14"/>
      <stop offset="1" stop-color="#06121C"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientTransform="translate(260 180) rotate(90) scale(380)">
      <stop stop-color="#7C5CFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientTransform="translate(940 320) rotate(90) scale(410)">
      <stop stop-color="#2DE2E6" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#8B5CFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CFF"/>
      <stop offset="1" stop-color="#2DE2E6"/>
    </linearGradient>
    <linearGradient id="headline" x1="68" y1="170" x2="640" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.65" stop-color="#E5E0FF"/>
      <stop offset="1" stop-color="#7AF8FC"/>
    </linearGradient>
    <linearGradient id="redBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4D6D"/>
      <stop offset="1" stop-color="#FF8FA3"/>
    </linearGradient>
    <linearGradient id="cyanBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#2DE2E6"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="680" y1="70" x2="1210" y2="570" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CFF" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#2DE2E6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8B5CFF" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#A99BFF" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glowLeft)"/>
  <rect width="1280" height="640" fill="url(#glowRight)"/>
  <rect x="24" y="24" width="1232" height="592" rx="30" fill="none" stroke="#A99BFF" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Left Column: Brand & Value Prop -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <!-- Top Brand Row -->
    <g transform="translate(68 62)">
      <rect width="52" height="52" rx="15" fill="#171330" stroke="#8B7CFF" stroke-opacity="0.65" stroke-width="1.5"/>
      <circle cx="26" cy="26" r="15" fill="none" stroke="#A99BFF" stroke-opacity="0.45" stroke-width="1.5"/>
      <path d="M15 37 L37 15" stroke="url(#ray)" stroke-width="5" stroke-linecap="round"/>
      <circle cx="26" cy="26" r="3.5" fill="#E0FFFF"/>
      <text x="68" y="36" fill="#FFFFFF" font-size="34" font-weight="800" letter-spacing="-0.8">CtxWise</text>
      <rect x="210" y="10" width="58" height="28" rx="8" fill="#1F1942" stroke="#8B5CFF" stroke-opacity="0.6"/>
      <text x="239" y="29" text-anchor="middle" fill="#C4B5FD" font-size="14" font-weight="700">v1.0</text>
    </g>

    <!-- Ecosystem Tagline Pill -->
    <g transform="translate(68 134)">
      <rect width="430" height="32" rx="16" fill="#111726" stroke="#2DE2E6" stroke-opacity="0.3"/>
      <circle cx="18" cy="16" r="4" fill="#2DE2E6"/>
      <text x="32" y="21" fill="#9EECEF" font-size="12.5" font-weight="700" letter-spacing="1.3">CLAUDE CODE · OPENAI CODEX · CURSOR · MCP</text>
    </g>

    <!-- Main Headline -->
    <text x="68" y="236" fill="url(#headline)" font-size="58" font-weight="800" letter-spacing="-2.2">Firewall the context.</text>
    <text x="68" y="304" fill="url(#headline)" font-size="58" font-weight="800" letter-spacing="-2.2">Trim the MCP bloat.</text>

    <!-- Subtitle -->
    <text x="68" y="354" fill="#B6B4CA" font-size="18" font-weight="500">
      Stop paying 30,000+ tokens/turn for unused MCP tool schemas.
    </text>
    <text x="68" y="384" fill="#8E8CA6" font-size="17" font-weight="500">
      Sync <tspan fill="#D9D6FF" font-weight="700">CLAUDE.md</tspan> &amp; <tspan fill="#D9D6FF" font-weight="700">AGENTS.md</tspan> · Scan secrets &amp; prompt injections.
    </text>

    <!-- Feature Badges -->
    <g transform="translate(68 424)">
      <rect width="186" height="50" rx="14" fill="#6D4AFF"/>
      <text x="93" y="31" text-anchor="middle" fill="#FFFFFF" font-size="15.5" font-weight="700">100% Local · No API</text>

      <rect x="200" width="178" height="50" rx="14" fill="#0F1D24" stroke="#2DE2E6" stroke-opacity="0.45"/>
      <text x="289" y="31" text-anchor="middle" fill="#67F3F6" font-size="15.5" font-weight="700">-83% MCP Tokens</text>

      <rect x="392" width="166" height="50" rx="14" fill="#121624" stroke="#FFFFFF" stroke-opacity="0.15"/>
      <text x="475" y="31" text-anchor="middle" fill="#E2E0EE" font-size="15.5" font-weight="650">GitHub Action @v1</text>
    </g>

    <!-- Bottom CLI & Repo Bar -->
    <g transform="translate(68 518)">
      <rect width="554" height="54" rx="14" fill="#0A0E17" stroke="#8B7CFF" stroke-opacity="0.28"/>
      <text x="20" y="33" fill="#2DE2E6" font-family="Consolas, monospace" font-size="17" font-weight="700">$</text>
      <text x="38" y="33" fill="#F4F3FF" font-family="Consolas, monospace" font-size="16.5" font-weight="600">npx @framy2/ctxwise mcp-xray --probe-stdio</text>
      <text x="466" y="33" fill="#7D7A94" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600">Apache-2.0</text>
    </g>
  </g>

  <!-- Right Column: Live Terminal & X-Ray Telemetry Card -->
  <g transform="translate(664 62)" font-family="Consolas, 'Cascadia Code', monospace">
    <!-- Card Shadow/Backdrop -->
    <rect x="0" y="0" width="552" height="514" rx="22" fill="#0B0F1A" stroke="url(#cardBorder)" stroke-width="2"/>
    
    <!-- Window Header -->
    <rect x="1" y="1" width="550" height="46" rx="21" fill="#121728"/>
    <circle cx="24" cy="24" r="6" fill="#FF5F56"/>
    <circle cx="44" cy="24" r="6" fill="#FFBD2E"/>
    <circle cx="64" cy="24" r="6" fill="#27C93F"/>
    <text x="276" y="29" text-anchor="middle" fill="#9492AD" font-size="13" font-weight="600">ctxwise — Context &amp; MCP X-Ray</text>

    <!-- Section 1: Startup Token Weight Comparison -->
    <g transform="translate(24 66)">
      <text x="0" y="18" fill="#A5A2C2" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.1">STARTUP TOKEN OVERHEAD (EVERY TURN)</text>

      <!-- Before Bar -->
      <text x="0" y="46" fill="#FF8FA3" font-size="13.5" font-weight="700">BEFORE (Raw MCP + Rules)</text>
      <text x="504" y="46" text-anchor="end" fill="#FF6B8B" font-size="14" font-weight="700">34,200 tok</text>
      <rect x="0" y="55" width="504" height="14" rx="7" fill="#1C1626"/>
      <rect x="0" y="55" width="484" height="14" rx="7" fill="url(#redBar)"/>

      <!-- After Bar -->
      <text x="0" y="94" fill="#6EE7B7" font-size="13.5" font-weight="700">AFTER (CtxWise Tree-Shake + Diet)</text>
      <text x="504" y="94" text-anchor="end" fill="#2DE2E6" font-size="14" font-weight="700">5,690 tok (-83%)</text>
      <rect x="0" y="103" width="504" height="14" rx="7" fill="#102027"/>
      <rect x="0" y="103" width="96" height="14" rx="7" fill="url(#cyanBar)"/>
    </g>

    <!-- Divider -->
    <line x1="24" y1="202" x2="528" y2="202" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <!-- Section 2: MCP Server Live Probe Breakdown -->
    <g transform="translate(24 220)">
      <text x="0" y="14" fill="#A5A2C2" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.1">LIVE STDIO PROBE (tools/list)</text>

      <!-- Row 1 -->
      <rect x="0" y="26" width="504" height="44" rx="10" fill="#141327" stroke="#FF4D6D" stroke-opacity="0.35"/>
      <circle cx="18" cy="48" r="5" fill="#FF4D6D"/>
      <text x="34" y="44" fill="#F4F3FF" font-size="13.5" font-weight="700">github-mcp</text>
      <text x="34" y="61" fill="#8E8CA8" font-size="11.5">26 tools · 22 unused schemas stripped</text>
      <rect x="382" y="34" width="108" height="26" rx="7" fill="#2B1424"/>
      <text x="436" y="51" text-anchor="middle" fill="#FF758F" font-size="12" font-weight="700">-16,400 tok</text>

      <!-- Row 2 -->
      <rect x="0" y="78" width="504" height="44" rx="10" fill="#141327" stroke="#F59E0B" stroke-opacity="0.35"/>
      <circle cx="18" cy="100" r="5" fill="#F59E0B"/>
      <text x="34" y="96" fill="#F4F3FF" font-size="13.5" font-weight="700">playwright-mcp</text>
      <text x="34" y="113" fill="#8E8CA8" font-size="11.5">21 tools · 18 unused schemas stripped</text>
      <rect x="382" y="86" width="108" height="26" rx="7" fill="#291F14"/>
      <text x="436" y="103" text-anchor="middle" fill="#FBBF24" font-size="12" font-weight="700">-10,950 tok</text>

      <!-- Row 3 -->
      <rect x="0" y="130" width="504" height="44" rx="10" fill="#101B24" stroke="#10B981" stroke-opacity="0.35"/>
      <circle cx="18" cy="152" r="5" fill="#10B981"/>
      <text x="34" y="148" fill="#F4F3FF" font-size="13.5" font-weight="700">postgres-mcp</text>
      <text x="34" y="165" fill="#8E8CA8" font-size="11.5">3 core tools kept · lean JSON schema</text>
      <rect x="382" y="138" width="108" height="26" rx="7" fill="#0E2923"/>
      <text x="436" y="155" text-anchor="middle" fill="#34D399" font-size="12" font-weight="700">1,120 tok OK</text>
    </g>

    <!-- Divider -->
    <line x1="24" y1="410" x2="528" y2="410" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <!-- Section 3: Security & Sync Status Pills -->
    <g transform="translate(24 424)">
      <rect x="0" y="0" width="244" height="64" rx="12" fill="#0E1E24" stroke="#2DE2E6" stroke-opacity="0.35"/>
      <text x="16" y="25" fill="#2DE2E6" font-size="12.5" font-weight="700">✓ SHIELD FIREWALL PASS</text>
      <text x="16" y="46" fill="#B4C6CC" font-size="11.5">0 secrets · 0 prompt injections</text>

      <rect x="260" y="0" width="244" height="64" rx="12" fill="#17142B" stroke="#8B5CFF" stroke-opacity="0.4"/>
      <text x="276" y="25" fill="#C4B5FD" font-size="12.5" font-weight="700">✓ CODEX &amp; CLAUDE SYNC</text>
      <text x="276" y="46" fill="#BDB9D6" font-size="11.5">32 KiB limit OK · rules aligned</text>
    </g>
  </g>
</svg>
