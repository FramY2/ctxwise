<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">CtxWise v1.0 — Multi-Agent Context Audit, MCP X-Ray &amp; Security Shield</title>
  <desc id="desc">Interactive terminal preview showing CtxWise auditing Claude Code, OpenAI Codex, and Cursor startup tokens, profiling bloated MCP tool schemas, and blocking secret leaks and prompt injection.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B081B"/>
      <stop offset="0.55" stop-color="#080B16"/>
      <stop offset="1" stop-color="#06121C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B73FF"/>
      <stop offset="0.5" stop-color="#2DE2E6"/>
      <stop offset="1" stop-color="#43E7C4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#A99BFF" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="680" rx="28" fill="url(#grid)"/>
  <circle cx="1080" cy="80" r="220" fill="#7657FF" opacity=".12"/>
  <circle cx="140" cy="600" r="190" fill="#2DE2E6" opacity=".08"/>
  <rect x="1" y="1" width="1198" height="678" rx="27" fill="none" stroke="#8B73FF" stroke-opacity=".28" stroke-width="2"/>

  <text x="64" y="60" fill="#2DE2E6" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3.2">CTXWISE V1.0 · ZERO API CALLS · 100% LOCAL DETERMINISTIC CLI</text>
  <text x="64" y="104" fill="#FFFFFF" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="800" letter-spacing="-0.8">What CtxWise catches in your repository in &lt;50ms</text>

  <!-- Terminal Window -->
  <rect x="64" y="132" width="1072" height="500" rx="18" fill="#070A12" stroke="#3B3358" stroke-width="2"/>
  <rect x="65" y="133" width="1070" height="52" rx="17" fill="#101524"/>
  <circle cx="96" cy="159" r="6.5" fill="#FF5F56"/>
  <circle cx="118" cy="159" r="6.5" fill="#FFBD2E"/>
  <circle cx="140" cy="159" r="6.5" fill="#27C93F"/>
  <text x="600" y="164" text-anchor="middle" fill="#9492AD" font-family="Consolas,Menlo,monospace" font-size="14" font-weight="600">zsh — ctxwise v1.0.0 (Claude Code · OpenAI Codex · Cursor · MCP)</text>
  <line x1="64" y1="185" x2="1136" y2="185" stroke="#252038" stroke-width="1.5"/>

  <g font-family="Consolas, 'Cascadia Code', monospace" font-size="15.5">
    <!-- Command 1: mcp-xray -->
    <g transform="translate(92 204)">
      <text x="0" y="18" fill="#2DE2E6" font-weight="700">$ npx @framy2/ctxwise mcp-xray --probe-stdio</text>
      <rect x="0" y="30" width="1016" height="106" rx="12" fill="#0D1220" stroke="#8B5CFF" stroke-opacity="0.28"/>
      <text x="20" y="56" fill="#FFFFFF" font-weight="700">CtxWise mcp-xray · 4 MCP servers · 24 tool schemas · ~18,420 tokens/turn</text>
      <text x="20" y="82" fill="#FF758F" font-size="14.5">  [BLOATED] ~2,840 tok · github/create_or_update_pull_request (19 params)</text>
      <text x="20" y="104" fill="#FF758F" font-size="14.5">  [BLOATED] ~1,920 tok · playwright/browser_snapshot_dom (15 params)</text>
      <text x="20" y="125" fill="#34D399" font-size="14.5" font-weight="700">  -&gt; Tree-shaking 40 unused tools saves ~27,350 startup tokens on every turn</text>
    </g>

    <!-- Command 2: agents & sync -->
    <g transform="translate(92 356)">
      <text x="0" y="18" fill="#2DE2E6" font-weight="700">$ npx @framy2/ctxwise agents &amp;&amp; npx @framy2/ctxwise sync --compress</text>
      <rect x="0" y="30" width="1016" height="84" rx="12" fill="#0D1220" stroke="#2DE2E6" stroke-opacity="0.28"/>
      <text x="20" y="56" fill="#FFFFFF" font-weight="700">CtxWise multi-agent · parity: SYNCED · Codex 32 KiB limit: PASS (4.2 KiB used)</text>
      <text x="20" y="82" fill="#C4B5FD" font-size="14.5">  [PASS] Synced AGENTS.md &lt;-&gt; CLAUDE.md &lt;-&gt; .cursor/rules/ctxwise.mdc</text>
      <text x="20" y="103" fill="#6EE7B7" font-size="14.5">  [DIET] Lossless Token Diet stripped comments &amp; duplicate rules (-34% tokens)</text>
    </g>

    <!-- Command 3: shield -->
    <g transform="translate(92 486)">
      <text x="0" y="18" fill="#2DE2E6" font-weight="700">$ npx @framy2/ctxwise shield --fail-on-risk</text>
      <rect x="0" y="30" width="1016" height="100" rx="12" fill="#160F1D" stroke="#FF4D6D" stroke-opacity="0.4"/>
      <text x="20" y="56" fill="#FF758F" font-weight="700">CtxWise shield · HIGH-RISK BLOCKED · 6 context files scanned · 2 findings</text>
      <text x="20" y="82" fill="#E5E0FF" font-size="14.5">  [HIGH] .mcp.json:14 — Hardcoded Anthropic API Key (sk-ant-api03-***REDACTED***)</text>
      <text x="20" y="104" fill="#E5E0FF" font-size="14.5">  [HIGH] .claude/skills/helper/SKILL.md:42 — Covert HTML prompt injection override</text>
      <text x="20" y="122" fill="#2DE2E6" font-size="14" font-weight="700">  -&gt; CI Gate: Exited with code 2 before secret or injection reached git/model</text>
    </g>
  </g>

  <rect x="64" y="650" width="1072" height="4" rx="2" fill="url(#accent)"/>
</svg>
